<title>Rasterstadt</title>

:root{--cell:34px;--green:#38d978;--red:#ff5a5f;--bg:#0c130f;--panel:#18241b;--text:#f5f7f2;--muted:#aab8ac;--road:#494d52}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#152018,#0b120e);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:1050px;margin:auto;padding:14px}

.actions{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}button{font:inherit}

.cell{width:var(--cell);height:var(--cell);border-right:1px solid #ffffff21;border-bottom:1px solid #ffffff21;position:relative}
.cell:nth-child(-n+20){border-top:1px solid #ffffff21}.cell:nth-child(20n+1){border-left:1px solid #ffffff21}

<div class="app">
<header><div><div class="eyebrow">PWA · AUFBAUSTRATEGIE</div><h1>Rasterstadt</h1></div><div class="actions"><span id="stat">0 / 400 belegt</span><button class="reset" id="reset">Neu starten</button></div></header>
<section class="tools">
<button class="tool active" data-tool="house"><b>🏠 Wohnhaus</b><small>2 × 2 Felder</small></button>
<button class="tool" data-tool="road"><b>🛣️ Straße</b><small>1 × 1 Feld</small></button>

</section>
<div class="hint" id="hint">Wohnhaus gewählt. Grün = bauen möglich, Rot = belegt oder außerhalb.</div>
<div class="shell"><div class="stage"><div id="board" class="board"></div></div></div>
<div class="legend"><span><i class="box g"></i>Bauen möglich</span><span><i class="box r"></i>Nicht möglich</span><span><i class="box o"></i>Belegt</span></div>
</div>
<div class="toast" id="toast"></div>
<script>
const S=20,board=document.querySelector('#board'),stat=document.querySelector('#stat'),hint=document.querySelector('#hint'),toast=document.querySelector('#toast');
const occ=Array.from({length:S},()=>Array(S).fill(null)),objs=new Map();let tool='house',n=0,preview=[],timer;
const cfg={house:{w:2,h:2,label:'Wohnhaus'},road:{w:1,h:1,label:'Straße'}};
function cell(r,c){return board.querySelector('[data-r="'+r+'"][data-c="'+c+'"]')}
function init(){board.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){const e=document.createElement('div');e.className='cell';e.dataset.r=r;e.dataset.c=c;e.onpointerenter=()=>show(r,c);e.onpointermove=()=>show(r,c);e.onclick=()=>tap(r,c);board.appendChild(e)}}
function foot(r,c,w,h){const a=[];for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)a.push([y,x]);return a}
function can(r,c,w,h){return r>=0&&c>=0&&r+h<=S&&c+w<=S&&foot(r,c,w,h).every(([y,x])=>!occ[y][x])}
function clear(){preview.forEach(e=>e.classList.remove('ok','bad'));preview=[]}
function show(r,c){clear();if(tool==='bulldozer')return;const q=cfg[tool],ok=can(r,c,q.w,q.h);foot(r,c,q.w,q.h).forEach(([y,x])=>{if(y<S&&x<S){const e=cell(y,x);e.classList.add(ok?'ok':'bad');preview.push(e)}})}
function tap(r,c){if(tool==='bulldozer')return demolish(r,c);const q=cfg[tool];if(!can(r,c,q.w,q.h)){msg('Hier kann nicht gebaut werden.');return show(r,c)}const id=tool+'-'+(++n),f=foot(r,c,q.w,q.h),o={id,type:tool,r,c,w:q.w,h:q.h,f};objs.set(id,o);f.forEach(([y,x])=>{occ[y][x]=id;const e=cell(y,x);e.dataset.id=id;if(tool==='road')e.classList.add('road')});if(tool==='house'){const e=document.createElement('div');e.className='building house';e.dataset.id=id;e.style.left='calc('+c+' * var(--cell))';e.style.top='calc('+r+' * var(--cell))';board.appendChild(e)}clear();update();msg(q.label+' gebaut.')}
function demolish(r,c){const id=occ[r][c];if(!id)return msg('Dieses Feld ist leer.');const o=objs.get(id);o.f.forEach(([y,x])=>{occ[y][x]=null;const e=cell(y,x);e.classList.remove('road');delete e.dataset.id});board.querySelector('.building[data-id="'+id+'"]')?.remove();objs.delete(id);update();msg('Objekt entfernt.')}
function update(){stat.textContent=occ.flat().filter(Boolean).length+' / 400 belegt'}
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1400)}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;clear();document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));hint.textContent=tool==='house'?'Wohnhaus gewählt. Grün = bauen möglich, Rot = belegt oder außerhalb.':tool==='road'?'Straße gewählt. Jede Straße belegt genau 1 Feld.':'Abreißen gewählt. Tippe ein vorhandenes Objekt an.'});
document.querySelector('#reset').onclick=()=>{if(!confirm('Spielfeld wirklich leeren?'))return;for(let r=0;r<S;r++)for(let c=0;c<S;c++)occ[r][c]=null;objs.clear();n=0;init();update();msg('Spielfeld zurückgesetzt.')};
board.onpointerleave=clear;init();update();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body></html>
