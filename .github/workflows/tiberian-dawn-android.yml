# Build definition for the isolated Tiberian Dawn Android branch.
name: Build Tiberian Dawn Android

on:
  pull_request:
  push:
    branches:
      - tiberian-dawn-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiberian-dawn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout port package
        uses: actions/checkout@v4

      - name: Validate port sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile td-mobile-port/apply.py
          test -s td-mobile-port/src/FreewareCatalog.java
          test -s td-mobile-port/src/FreewareDataActivity.java
          test -s td-mobile-port/src/FreewareDownloadClient.java
          test -s td-mobile-port/src/FreewareIsoVerifier.java
          test -s td-mobile-port/src/GermanPackageInstaller.java
          test -s td-mobile-port/native/android_inno_bridge.cpp
          test -s td-mobile-port/src/MobileTouchDock.java
          test -s td-mobile-port/src/MobileTouchGuide.java
          test -s td-mobile-port/src/MobileDisplayController.java

      - name: Checkout pinned Android upstream
        uses: actions/checkout@v4
        with:
          repository: Cesarus85/Tiberian-Dawn-for-Android-and-Meta-Quest
          ref: f80b8aef0877ed0fc6ca7ca5771f4ca217327c6c
          path: upstream

      - name: Apply no-disc and touch-first Android changes
        shell: bash
        run: |
          set -euo pipefail
          python3 td-mobile-port/apply.py upstream
          python3 td-mobile-port/apply.py upstream
          grep -q 'mobile_touch_help_title' upstream/android/app/src/main/res/values-de/strings.xml
          grep -q 'FreewareDataActivity' upstream/android/app/src/mobile/AndroidManifest.xml
          grep -q 'installMobileTouchControls' upstream/android/app/src/main/java/org/tiberiandawn/android/TiberianDawnActivity.java
          grep -q 'mobileDisplayController.onDispatchTouchEvent' upstream/android/app/src/main/java/org/tiberiandawn/android/TiberianDawnActivity.java
          grep -q 'mobile_touch_menu' upstream/android/app/src/main/res/values-de/strings.xml
          grep -q 'Video.ArtworkMode = 1;' upstream/common/settings.cpp
          grep -q 'installDownloadedGameData' upstream/android/app/src/main/java/org/tiberiandawn/android/GameDataImportActivity.java
          grep -q 'FreewareDownloadClient' upstream/android/app/src/main/java/org/tiberiandawn/android/FreewareDataActivity.java
          grep -q 'GERMAN_CORE_MODDB_FILE_ID' upstream/android/app/src/main/java/org/tiberiandawn/android/FreewareCatalog.java
          grep -q 'nativeExtractInno' upstream/android/app/src/main/java/org/tiberiandawn/android/GermanPackageInstaller.java
          grep -q 'MOVIESGER.MIX' upstream/tiberiandawn/init.cpp
          grep -q 'SPEECGER.MIX' upstream/tiberiandawn/init.cpp
          grep -q 'android_inno_bridge.cpp' upstream/tiberiandawn/CMakeLists.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/android/**/*.gradle*

      - name: Test freeware mirror resolver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/td-java-test
          javac -d /tmp/td-java-test \
            td-mobile-port/src/FreewareCatalog.java \
            td-mobile-port/src/FreewareDownloadClient.java \
            td-mobile-port/tests/FreewareDownloadClientTest.java
          java -cp /tmp/td-java-test org.tiberiandawn.android.FreewareDownloadClientTest

      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          cmake_root=$(dirname "$(dirname "$(command -v cmake)")")
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$cmake_root" > upstream/android/local.properties
          cmake --version
          java -version

      - name: Bundle pinned ARM64 InnoExtract runtime
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/alanwoolley/innoextract-android/releases/download/v4.0.0/App-arm64-v8a-release-signed.apk'
          curl -L --fail --retry 3 -o /tmp/innoextract-android.apk "$url"
          echo '4cd98d47e235ab802d9c74b96ed62277acce8718b4125f1e20d2fbcfdeb9e0e3  /tmp/innoextract-android.apk' | sha256sum -c -
          mkdir -p upstream/android/app/src/main/jniLibs/arm64-v8a
          unzip -p /tmp/innoextract-android.apk lib/arm64-v8a/libinnoextract.so > upstream/android/app/src/main/jniLibs/arm64-v8a/libinnoextract.so
          echo '8acf21f50103e44a3d4d5a163022f4545e6a792eccbc24eee9fbc9732657fd40  upstream/android/app/src/main/jniLibs/arm64-v8a/libinnoextract.so' | sha256sum -c -
          file upstream/android/app/src/main/jniLibs/arm64-v8a/libinnoextract.so

      - name: Build mobile debug APK
        working-directory: upstream/android
        shell: bash
        run: |
          set -euo pipefail
          cmake_version=$(cmake --version | sed -n '1s/.* //p')
          ./gradlew --no-daemon -PandroidCmakeVersion="$cmake_version" :app:testMobileDebugUnitTest :app:assembleMobileDebug

      - name: Apply stable development signature
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s "$apk"
          # Public AOSP test key: intentionally insecure and used ONLY so our
          # iterative sideloaded development builds keep a stable signer.
          # A production/release build must use a private release key instead.
          curl -fsSL 'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.pk8?format=TEXT' | base64 -d > /tmp/td-testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > /tmp/td-testkey.x509.pem
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key /tmp/td-testkey.pk8 \
            --cert /tmp/td-testkey.x509.pem \
            --out "$apk.stable" "$apk"
          mv "$apk.stable" "$apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libmain\.so
          sha256sum "$apk" | tee td-mobile-port/mobile-apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tiberian-dawn-mobile-debug
          path: |
            upstream/android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            td-mobile-port/mobile-apk.sha256
          if-no-files-found: error
          retention-days: 14

          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libinnoextract\.so
          sha256sum "$apk" | tee td-mobile-port/mobile-apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tiberian-dawn-mobile-debug
          path: |
            upstream/android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            td-mobile-port/mobile-apk.sha256
          if-no-files-found: error
          retention-days: 14

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          sha256sum "$apk" | tee td-mobile-port/mobile-apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tiberian-dawn-mobile-debug
          path: |
            upstream/android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            td-mobile-port/mobile-apk.sha256
          if-no-files-found: error
          retention-days: 14
