name: Build RA2 Yuri Android
# build-version: 0.44-guest-physical-cd-and-forensics

on:
  push:
    branches:
      - ra2-yuri-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ra2-yuri-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned compatibility helper
        uses: actions/checkout@v4
        with:
          repository: nckstwrt/SafeDiscLoader2
          ref: 91b6b89da8296276c36ff1a8fea2456c892ca865
          path: compatibility-source
      - uses: microsoft/setup-msbuild@v2
      - name: Build standalone 32-bit compatibility helper
        shell: pwsh
        run: |
          python ra2-mobile-port/safedisc/prepare.py compatibility-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = "$env:GITHUB_WORKSPACE\compat-output\"
          msbuild compatibility-source/version-proxy.sln /m /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /p:OutDir="$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ra2-mobile-port/safedisc/package.py compatibility-source compat-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cd-compatibility
          path: |
            compat-output/VersionInjector.exe
            compat-output/version.dll
            compat-output/SafeDiscLoader2-*
          if-no-files-found: error
  build:
    needs: compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout mobile patch
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator runtime
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: 96504ff4ef34a9cbad9d03d70d1f420fcb8338ec
          path: upstream
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          name: cd-compatibility
          path: cd-compatibility
      - name: Include compatibility helper and corresponding source
        run: |
          mkdir -p upstream/app/src/main/assets/safedisc upstream/app/src/main/assets/licenses
          cp cd-compatibility/VersionInjector.exe cd-compatibility/version.dll upstream/app/src/main/assets/safedisc/
          cp cd-compatibility/SafeDiscLoader2-* upstream/app/src/main/assets/licenses/

      - name: Checkout pinned GPL RA2 VM engine
        uses: actions/checkout@v4
        with:
          repository: ra2-games/ra2
          ref: a10ac9899c258b01be1edd80492397e9de225ba5
          path: ra2vm-upstream

      - name: Set up Node 24 for RA2 VM
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the offline RA2/Yuri VM engine
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.24.0
          cd ra2vm-upstream
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/ui/pages/game/components/GameSourcePickerView.tsx")
          s=p.read_text()
          original='{import.meta.env.DEV && ('
          new="{(import.meta.env.DEV || window.location.hostname === 'ra2.android.local') && ("
          assert s.count(original)==1, 'Could not enable offline local game picker'
          s=s.replace(original,new)
          original="{t('开发测试')}"
          new="{window.location.hostname === 'ra2.android.local' ? 'Installierte RA2-/Yuri-Dateien laden' : t('开发测试')}"
          assert s.count(original)==1, 'Could not label offline local game picker'
          s=s.replace(original,new)
          # On Android no ISO is selectable through the generic EXE/ZIP picker.
          # The already-extracted original discs are automatically virtualized.
          start=s.index("              <Ra2MenuButton disabled={actionsDisabled} onClick={() => props.pick('archive')}>")
          folder=s.index("props.pick('folder')", start)
          close="</Ra2MenuButton>"
          end=s.index(close, folder)+len(close)
          buttons=s[start:end]
          before="              {window.location.hostname !== 'ra2.android.local' && (\n                <>\n"
          after="\n                </>\n              )}"
          s=s[:start]+before+buttons+after+s[end:]
          original="{t('导入 ZIP / EXE 压缩包或完整游戏目录。')}"
          new="{window.location.hostname === 'ra2.android.local' ? 'Original-ISOs sind bereits installiert. Spielversion oben auswählen; CD 2 wird virtuell eingebunden.' : t('导入 ZIP / EXE 压缩包或完整游戏目录。')}"
          assert s.count(original)==1, 'Resource guide changed upstream'
          s=s.replace(original,new)
          p.write_text(s)
          # Enable Wine-free Win32 CD emulation for actual original CD game.exe:
          # The stock RA2 VM catalog only advertises C:, causing the retail
          # executable to ask for its second original disc.
          p=Path("src/games/catalog.ts")
          s=p.read_text()
          assert "import { DRIVE_FIXED } from '../vm86/win32';" in s
          s=s.replace("import { DRIVE_FIXED } from '../vm86/win32';",
                      "import { DRIVE_CDROM, DRIVE_FIXED } from '../vm86/win32';")
          assert s.count("// D: DRIVE_CDROM,")==2, 'Expected CD setting in RA2 + Yuri profiles'
          s=s.replace("// D: DRIVE_CDROM,","D: DRIVE_CDROM,")
          p.write_text(s)
          # The Android offline origin should not register an independent
          # service worker that could cache stale user files.
          p=Path("src/main.ts")
          s=p.read_text()
          s=s.replace("if (import.meta.env.PROD && 'serviceWorker' in navigator) {",
            "if (import.meta.env.PROD && window.location.hostname !== 'ra2.android.local' && 'serviceWorker' in navigator) {")
          p.write_text(s)
          # Native Android landscape UI: widescreen options for real in-game
          # viewport; keep classic 4:3 menu artwork aspect-correct.
          p=Path("src/games/resolution.ts")
          s=p.read_text()
          original="  { width: 1920, height: 1080 },"
          assert s.count(original)==1
          s=s.replace(original,original+"\n  { width: 2080, height: 960 },\n  { width: 2340, height: 1080 },\n  { width: 3120, height: 1440 },")
          p.write_text(s)
          p=Path("src/ui/pages/game/components/RuntimeToolbarView.tsx")
          s=p.read_text()
          original="const resolutions = ['', '800x600', '1024x768', '1280x720', '1280x800', '1440x900', '1600x900', '1920x1080'];"
          assert s.count(original)==1
          s=s.replace(original,
            "const resolutions = ['', '800x600', '1024x768', '1280x720', '1280x800', '1440x900', '1600x900', '1920x1080', '2080x960', '2340x1080', '3120x1440'];")
          p.write_text(s)
          # Only Android gets the full-width default; the user's own resolution
          # choice persists, including an explicit "Use INI" sentinel.
          p=Path("src/ui/pages/game/vmPageResolution.ts")
          s=p.read_text()
          start=s.index("export function loadStoredResolution(")
          end=s.index("export function storeResolution(",start)
          s=s[:start]+"""export function loadStoredResolution(gameId: SupportedGameId): GameResolution | null {
            try {
              const raw = window.localStorage.getItem(STORED_RESOLUTION_PREFIX + gameId);
              if (raw === 'ini') return null;
              const saved = parseGameResolution(raw);
              if (saved) return saved;
              return window.location.hostname === 'ra2.android.local' ? { width: 2080, height: 960 } : null;
            } catch {
              return null;
            }
          }

          """+s[end:]
          original="    else window.localStorage.removeItem(key);"
          assert s.count(original)==1
          s=s.replace(original,
            "    else if (window.location.hostname === 'ra2.android.local') window.localStorage.setItem(key, 'ini');\n" +
            "    else window.localStorage.removeItem(key);")
          p.write_text(s)
          # Activate mobile-only rules at document creation, avoiding visible
          # flashes of the PC diagnostics toolbar while the game is loading.
          p=Path("index.html")
          s=p.read_text()
          assert s.count("</head>")==1
          # One-time upgrade from stored 4:3 settings; never overwrite user-selected 16:9/21:9 or subsequent choices.
          wide_bootstrap="""<script>
          if(location.hostname==='ra2.android.local'){
            document.documentElement.classList.add('ra2-android');
            try{
              const migrationKey='ra2-android-widescreen-v041';
              if(localStorage.getItem(migrationKey)!=='1'){
                for(const game of ['ra2','yr']){
                  const key='vm-resolution-'+game;
                  const old=localStorage.getItem(key);
                  if(!old||['800x600','1024x768','1280x960'].includes(old)){
                    localStorage.setItem(key,'2080x960');
                  }
                }
                localStorage.setItem(migrationKey,'1');
              }
            }catch(error){}
          }
          </script>"""
          s=s.replace("</head>",wide_bootstrap+"</head>")
          p.write_text(s)
          # Load the actual CD-installation values already present in the
          # user's private Android Winlator registry/preferences. Never ship
          # serials in the APK, logs, network requests, or build products.
          p=Path("src/adapter/vmWorkerController.ts")
          s=p.read_text()
          anchor="    this.sourceTemplate = source.files;"
          assert s.count(anchor)==1
          injection="""    if (globalThis.location?.hostname === 'ra2.android.local') {
                try {
                  const answer = await fetch('/android-installation.json', { cache: 'no-store' });
                  if (answer.ok) {
                    const installation = await answer.json() as {
                      ra2Serial?: string; yuriSerial?: string;
                      ra2Cd2Ready?: boolean; cdEmulationEnabled?: boolean;
                    };
                    if (source.game.id === 'ra2') {
                      const discPresent = installation.ra2Cd2Ready === true;
                      const virtualCdEnabled = installation.cdEmulationEnabled !== false;
                      if (discPresent && virtualCdEnabled) {
                        source.game = {
                          ...source.game,
                          driveTypes: { ...source.game.driveTypes, D: 5 },
                        };
                      }
                      console.info('[RA2-FORENSIK] Android Original-CD2=' +
                        (discPresent ? 'VORHANDEN' : 'FEHLT') + ' Gast-D=' +
                        (discPresent && virtualCdEnabled ? 'CDROM' : 'AUS') +
                        ' CD-Testmodus=' + (virtualCdEnabled ? 'EIN' : 'AUS'));
                    }
                    const serial = (source.game.id === 'yr' ? installation.yuriSerial : installation.ra2Serial) ?? '';
                    if (/^[A-Z0-9]{10,40}$/.test(serial)) {
                      const name = source.game.id === 'yr' ? "yuri's revenge" : 'red alert 2';
                      const regSz = (input: string) => ({ type: 1, bytes: [...new TextEncoder().encode(input), 0] });
                      const regDword = (num: number) => ({ type: 4, bytes: [num & 255, (num >> 8) & 255, (num >> 16) & 255, (num >> 24) & 255] });
                      const defaults: Record<string, { type: number; bytes: readonly number[] }> = { ...source.game.shimProfile.registryDefaults };
                      for (const prefix of [
                        'hklm\\\\software\\\\westwood\\\\' + name,
                        'hklm\\\\software\\\\wow6432node\\\\westwood\\\\' + name,
                      ]) {
                        defaults[prefix + '\\\\serial'] = regSz(serial);
                        defaults[prefix + '\\\\name'] = regSz(source.game.id === 'yr' ? "Yuri's Revenge" : 'Red Alert 2');
                        defaults[prefix + '\\\\folderpath'] = regSz('C:\\\\GAME');
                        defaults[prefix + '\\\\installpath'] = regSz('C:\\\\GAME');
                        defaults[prefix + '\\\\version'] = regDword(source.game.id === 'yr' ? 0x00010001 : 0x00010006);
                        defaults[prefix + '\\\\sku'] = regDword(source.game.id === 'yr' ? 0x00000901 : 0x00000801);
                      }
                      source.game = {
                        ...source.game,
                        shimProfile: { ...source.game.shimProfile, registryDefaults: defaults },
                      };
                      console.info('[RA2-ANDROID] Original installation registration connected (key not logged).');
                    } else {
                      console.warn('[RA2-ANDROID] Original installation serial not available, legacy protection may terminate games.');
                    }
                  }
                } catch (error) {
                  console.warn('[RA2-ANDROID] Unable to read original installation registration, key not logged.');
                }
              }
          """
          s=s.replace(anchor,injection+anchor)
          p.write_text(s)
          PY
          python3 ../ra2-mobile-port/patch_ra2_vm_forensics.py
          cat ../ra2-mobile-port/resources/ra2vm-android.css >> src/ui/pages/game/styles.css
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          test -s ra2vm-upstream/dist/index.html
          grep -R -l '2080x960' ra2vm-upstream/dist/assets/*.js >/dev/null
          test -d ra2vm-upstream/dist/assets
          mkdir -p upstream/app/src/main/assets/ra2vm
          cp -a ra2vm-upstream/dist/. upstream/app/src/main/assets/ra2vm/
          mkdir -p upstream/app/src/main/assets/licenses
          cp ra2vm-upstream/LICENSE upstream/app/src/main/assets/licenses/RA2VM-GPL-3.0.txt
          du -sh upstream/app/src/main/assets/ra2vm

      - name: Restore Winlator 7.1 runtime asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://github.com/brunodev85/winlator/releases/download/v7.1.0/Winlator_7.1.apk' \
            -o /tmp/winlator-7.1.apk
          unzip -p /tmp/winlator-7.1.apk assets/imagefs.txz > upstream/app/src/main/assets/imagefs.txz
          test -s upstream/app/src/main/assets/imagefs.txz
          test "$(stat -c%s upstream/app/src/main/assets/imagefs.txz)" -gt 100000000

          rm -rf /tmp/winlator-libs upstream/app/src/main/jniLibs
          mkdir -p /tmp/winlator-libs upstream/app/src/main/jniLibs/arm64-v8a
          unzip -q /tmp/winlator-7.1.apk 'lib/arm64-v8a/*.so' -d /tmp/winlator-libs
          cp /tmp/winlator-libs/lib/arm64-v8a/*.so upstream/app/src/main/jniLibs/arm64-v8a/
          test -n "$(find upstream/app/src/main/jniLibs/arm64-v8a -name '*.so' -print -quit)"

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/brunodev85/winlator-app/3981d86efa4f333b2a34a7da8b6521476cd8c8b9'
          curl -fL "$BASE/build.gradle" -o upstream/build.gradle
          curl -fL "$BASE/settings.gradle" -o upstream/settings.gradle
          curl -fL "$BASE/gradle.properties" -o upstream/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' >> upstream/gradle.properties
          mkdir -p upstream/gradle/wrapper
          curl -fL "$BASE/gradle/wrapper/gradle-wrapper.properties" -o upstream/gradle/wrapper/gradle-wrapper.properties
          curl -fL "$BASE/gradle/wrapper/gradle-wrapper.jar" -o upstream/gradle/wrapper/gradle-wrapper.jar
          curl -fL "$BASE/gradlew" -o upstream/gradlew
          chmod +x upstream/gradlew

      - name: Apply RA2 Android changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ra2-mobile-port/apply_legacy.py
          python3 ra2-mobile-port/apply_legacy.py upstream
          grep -q "applicationId 'com.winlator'" upstream/app/build.gradle
          grep -q 'RA2LauncherActivity' upstream/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' upstream/app/src/main/AndroidManifest.xml
          grep -q 'DownloadManager' upstream/app/src/main/java/com/winlator/RA2LauncherActivity.java
          grep -q 'setRtsMode' upstream/app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -q 'exec_dos_path' upstream/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'SUPPORTED_32_BIT_ABIS' upstream/app/src/main/java/com/winlator/RA2LauncherActivity.java
          grep -q 'RA2DiagnosticsActivity' upstream/app/src/main/AndroidManifest.xml
          grep -q 'RA2VmActivity' upstream/app/src/main/AndroidManifest.xml
          test -s upstream/app/src/main/assets/ra2vm/index.html
          test -s upstream/app/src/main/java/com/winlator/RA2VmFiles.java
          test -s upstream/app/src/main/java/com/winlator/RA2DiagnosticsActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-30" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;22.1.7171670" \
            "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > upstream/local.properties

      - name: Test and build native CAB extractor
        shell: bash
        run: |
          set -euo pipefail
          javac -d test-launch ra2-mobile-port/src/RA2LaunchBatch.java ra2-mobile-port/src/RA2DiagnosticEvidence.java ra2-mobile-port/src/RA2SerialPolicy.java ra2-mobile-port/tests/RA2LaunchBatchTest.java ra2-mobile-port/tests/RA2DiagnosticEvidenceTest.java ra2-mobile-port/tests/RA2SerialPolicyTest.java
          javac -d test-launch ra2-mobile-port/src/RA2CdForensics.java ra2-mobile-port/tests/RA2CdForensicsTest.java
          java -cp test-launch RA2CdForensicsTest
          javac -d test-launch ra2-mobile-port/src/RA2ZipExport.java ra2-mobile-port/src/RA2SerialPolicy.java ra2-mobile-port/tests/RA2ZipExportTest.java
          java -cp test-launch RA2ZipExportTest
          javac -d test-launch ra2-mobile-port/src/Iso9660Extractor.java ra2-mobile-port/tests/RA2VolumeLabelTest.java
          java -cp test-launch RA2VolumeLabelTest
          javac -d test-launch ra2-mobile-port/src/RA2XwisClient.java ra2-mobile-port/tests/RA2XwisClientTest.java
          java -cp test-launch RA2XwisClientTest
          javac -d test-launch ra2-mobile-port/src/RA2VmGameDiscovery.java ra2-mobile-port/tests/RA2VmGameDiscoveryTest.java
          java -cp test-launch RA2VmGameDiscoveryTest
          javac -d test-launch ra2-mobile-port/src/RA2VmGameDiscovery.java ra2-mobile-port/src/RA2VmMediaOverlay.java ra2-mobile-port/tests/RA2VmMediaOverlayTest.java
          java -cp test-launch RA2VmMediaOverlayTest
          java -cp test-launch RA2LaunchBatchTest
          java -cp test-launch RA2DiagnosticEvidenceTest
          java -cp test-launch RA2SerialPolicyTest
          ra2-mobile-port/native/build.sh test-native cc -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"
          python3 ra2-mobile-port/tests/make_cabs.py
          javac -d test-native ra2-mobile-port/src/CabExtractor.java ra2-mobile-port/tests/CabExtractorTest.java
          java -Djava.library.path=test-native -cp test-native CabExtractorTest
          toolchain="$ANDROID_HOME/ndk/22.1.7171670/toolchains/llvm/prebuilt/linux-x86_64"
          LD_LIBRARY_PATH="$toolchain/lib64" ra2-mobile-port/native/build.sh upstream/app/src/main/jniLibs/arm64-v8a "$toolchain/bin/aarch64-linux-android26-clang" -fuse-ld=lld
          mkdir -p upstream/app/src/main/assets/licenses
          cp ra2-mobile-port/native/LICENSE.libmspack upstream/app/src/main/assets/licenses/
          cp ra2-mobile-port/native/NOTICE upstream/app/src/main/assets/licenses/libmspack-NOTICE

      - name: Build debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Apply stable development signature
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/app/build/outputs/apk/debug/app-debug.apk
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.pk8?format=TEXT' \
            | base64 -d > /tmp/ra2-testkey.pk8; then
            curl -fsSL --retry 6 --retry-all-errors \
              'https://raw.githubusercontent.com/aosp-mirror/platform_build/android-14.0.0_r1/target/product/security/testkey.pk8' \
              -o /tmp/ra2-testkey.pk8
          fi
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 -d > /tmp/ra2-testkey.x509.pem; then
            curl -fsSL --retry 6 --retry-all-errors \
              'https://raw.githubusercontent.com/aosp-mirror/platform_build/android-14.0.0_r1/target/product/security/testkey.x509.pem' \
              -o /tmp/ra2-testkey.x509.pem
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key /tmp/ra2-testkey.pk8 \
            --cert /tmp/ra2-testkey.x509.pem \
            --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -Z1 "$apk" > /tmp/ra2-apk-files.txt
          grep -q 'lib/arm64-v8a/libra2cab.so' /tmp/ra2-apk-files.txt
          grep -q 'assets/safedisc/VersionInjector.exe' /tmp/ra2-apk-files.txt
          grep -q 'assets/safedisc/version.dll' /tmp/ra2-apk-files.txt
          grep -q 'assets/licenses/SafeDiscLoader2-source.zip' /tmp/ra2-apk-files.txt
          sha256sum "$apk" | tee ra2-yuri-mobile.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ra2-yuri-android-debug
          path: |
            upstream/app/build/outputs/apk/debug/app-debug.apk
            ra2-yuri-mobile.sha256
          if-no-files-found: error
          retention-days: 14

  publish-v044:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK from current build
        uses: actions/download-artifact@v4
        with:
          name: ra2-yuri-android-debug
          path: release
      - name: Publish direct-download APK and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk=release/upstream/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" RA2-Yuri-Android-v0.44.apk
          unzip -t RA2-Yuri-Android-v0.44.apk >/dev/null
          sha256sum RA2-Yuri-Android-v0.44.apk > RA2-Yuri-Android-v0.44.sha256
          tag=ra2-yuri-android-v0.44
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" RA2-Yuri-Android-v0.44.apk RA2-Yuri-Android-v0.44.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" RA2-Yuri-Android-v0.44.apk RA2-Yuri-Android-v0.44.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'RA2 / Yuri Android v0.44 – CD2-Prüfung und Gefechtsdiagnose' \
