name: Build RA2 Yuri Android
# build-version: 0.21-launch-fix

on:
  push:
    branches:
      - ra2-yuri-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ra2-yuri-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout mobile patch
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator runtime
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: 96504ff4ef34a9cbad9d03d70d1f420fcb8338ec
          path: upstream
          lfs: false

      - name: Restore Winlator 7.1 runtime asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://github.com/brunodev85/winlator/releases/download/v7.1.0/Winlator_7.1.apk' \
            -o /tmp/winlator-7.1.apk
          unzip -p /tmp/winlator-7.1.apk assets/imagefs.txz > upstream/app/src/main/assets/imagefs.txz
          test -s upstream/app/src/main/assets/imagefs.txz
          test "$(stat -c%s upstream/app/src/main/assets/imagefs.txz)" -gt 100000000

          rm -rf /tmp/winlator-libs upstream/app/src/main/jniLibs
          mkdir -p /tmp/winlator-libs upstream/app/src/main/jniLibs/arm64-v8a
          unzip -q /tmp/winlator-7.1.apk 'lib/arm64-v8a/*.so' -d /tmp/winlator-libs
          cp /tmp/winlator-libs/lib/arm64-v8a/*.so upstream/app/src/main/jniLibs/arm64-v8a/
          test -n "$(find upstream/app/src/main/jniLibs/arm64-v8a -name '*.so' -print -quit)"

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/brunodev85/winlator-app/3981d86efa4f333b2a34a7da8b6521476cd8c8b9'
          curl -fL "$BASE/build.gradle" -o upstream/build.gradle
          curl -fL "$BASE/settings.gradle" -o upstream/settings.gradle
          curl -fL "$BASE/gradle.properties" -o upstream/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' >> upstream/gradle.properties
          mkdir -p upstream/gradle/wrapper
          curl -fL "$BASE/gradle/wrapper/gradle-wrapper.properties" -o upstream/gradle/wrapper/gradle-wrapper.properties
          curl -fL "$BASE/gradle/wrapper/gradle-wrapper.jar" -o upstream/gradle/wrapper/gradle-wrapper.jar
          curl -fL "$BASE/gradlew" -o upstream/gradlew
          chmod +x upstream/gradlew

      - name: Apply RA2 Android changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ra2-mobile-port/apply_legacy.py
          python3 ra2-mobile-port/apply_legacy.py upstream
          grep -q "applicationId 'com.winlator'" upstream/app/build.gradle
          grep -q 'RA2LauncherActivity' upstream/app/src/main/AndroidManifest.xml
          grep -q 'setRtsMode' upstream/app/src/main/java/com/winlator/widget/TouchpadView.java
          grep -q 'exec_dos_path' upstream/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'SUPPORTED_32_BIT_ABIS' upstream/app/src/main/java/com/winlator/RA2LauncherActivity.java
          grep -q 'RA2DiagnosticsActivity' upstream/app/src/main/AndroidManifest.xml
          test -s upstream/app/src/main/java/com/winlator/RA2DiagnosticsActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-30" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;22.1.7171670" \
            "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > upstream/local.properties

      - name: Test and build native CAB extractor
        shell: bash
        run: |
          set -euo pipefail
          javac -d test-launch ra2-mobile-port/src/RA2LaunchBatch.java ra2-mobile-port/tests/RA2LaunchBatchTest.java
          java -cp test-launch RA2LaunchBatchTest
          ra2-mobile-port/native/build.sh test-native cc -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"
          python3 ra2-mobile-port/tests/make_cabs.py
          javac -d test-native ra2-mobile-port/src/CabExtractor.java ra2-mobile-port/tests/CabExtractorTest.java
          java -Djava.library.path=test-native -cp test-native CabExtractorTest
          toolchain="$ANDROID_HOME/ndk/22.1.7171670/toolchains/llvm/prebuilt/linux-x86_64"
          LD_LIBRARY_PATH="$toolchain/lib64" ra2-mobile-port/native/build.sh upstream/app/src/main/jniLibs/arm64-v8a "$toolchain/bin/aarch64-linux-android26-clang" -fuse-ld=lld
          mkdir -p upstream/app/src/main/assets/licenses
          cp ra2-mobile-port/native/LICENSE.libmspack upstream/app/src/main/assets/licenses/
          cp ra2-mobile-port/native/NOTICE upstream/app/src/main/assets/licenses/libmspack-NOTICE

      - name: Build debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Apply stable development signature
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/app/build/outputs/apk/debug/app-debug.apk
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.pk8?format=TEXT' \
            | base64 -d > /tmp/ra2-testkey.pk8; then
            curl -fsSL --retry 6 --retry-all-errors \
              'https://raw.githubusercontent.com/aosp-mirror/platform_build/android-14.0.0_r1/target/product/security/testkey.pk8' \
              -o /tmp/ra2-testkey.pk8
          fi
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 -d > /tmp/ra2-testkey.x509.pem; then
            curl -fsSL --retry 6 --retry-all-errors \
              'https://raw.githubusercontent.com/aosp-mirror/platform_build/android-14.0.0_r1/target/product/security/testkey.x509.pem' \
              -o /tmp/ra2-testkey.x509.pem
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key /tmp/ra2-testkey.pk8 \
            --cert /tmp/ra2-testkey.x509.pem \
            --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -Z1 "$apk" > /tmp/ra2-apk-files.txt
          grep -q 'lib/arm64-v8a/libra2cab.so' /tmp/ra2-apk-files.txt
          sha256sum "$apk" | tee ra2-yuri-mobile.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ra2-yuri-android-debug
          path: |
            upstream/app/build/outputs/apk/debug/app-debug.apk
            ra2-yuri-mobile.sha256
          if-no-files-found: error
          retention-days: 14
