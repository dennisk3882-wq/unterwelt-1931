name: Build TCG Karten-Coach Android

on:
  push:
    branches:
      - pokemon-card-trainer-android
    paths:
      - 'pokemon-card-trainer/**'
      - '.github/workflows/pokemon-card-trainer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-card-trainer-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit, rule and corpus tests
        working-directory: pokemon-card-trainer
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Compose instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd pokemon-card-trainer && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Apply stable development signature
        shell: bash
        run: |
          set -euo pipefail
          apk=pokemon-card-trainer/app/build/outputs/apk/debug/app-debug.apk
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.pk8?format=TEXT' \
            | base64 -d > /tmp/tcg-testkey.pk8; then
            curl -fsSL --retry 6 --retry-all-errors \
              'https://raw.githubusercontent.com/aosp-mirror/platform_build/android-14.0.0_r1/target/product/security/testkey.pk8' \
              -o /tmp/tcg-testkey.pk8
          fi
          if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/build/+/android-14.0.0_r1/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 -d > /tmp/tcg-testkey.x509.pem; then
            curl -fsSL --retry 6 --retry-all-errors \
              'https://raw.githubusercontent.com/aosp-mirror/platform_build/android-14.0.0_r1/target/product/security/testkey.x509.pem' \
              -o /tmp/tcg-testkey.x509.pem
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key /tmp/tcg-testkey.pk8 \
            --cert /tmp/tcg-testkey.x509.pem \
            --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp pokemon-card-trainer/app/build/outputs/apk/debug/app-debug.apk dist/TCG-Karten-Coach-2.4.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/TCG-Karten-Coach-2.4.2.apk
          sha256sum dist/TCG-Karten-Coach-2.4.2.apk | tee dist/TCG-Karten-Coach-2.4.2.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCG-Karten-Coach-2.4.2
          path: |
            dist/TCG-Karten-Coach-2.4.2.apk
            dist/TCG-Karten-Coach-2.4.2.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="tcg-karten-coach-v2.4.2"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/TCG-Karten-Coach-2.4.2.apk dist/TCG-Karten-Coach-2.4.2.sha256 --clobber
          else
            gh release create "$tag" dist/TCG-Karten-Coach-2.4.2.apk dist/TCG-Karten-Coach-2.4.2.sha256 --target "$GITHUB_SHA" --title "TCG Karten-Coach 2.4.2 – Mehrkarten-Scanner" --notes "Version 2.4.2: Vier kindgerechte Scan-Modi mit klaren Erklärungen. Einzel-Scan startet mit automatischer Randkorrektur; genauer Scan bietet zusätzliche Bildkorrektur und Bestätigung. Nacheinander- und Mehrfach-Fotoscan bleiben erhalten."
          fi

      - name: Record successful build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          echo "Version: 2.4.2" > build-status/pokemon-card-trainer.txt
          echo "Commit: $GITHUB_SHA" >> build-status/pokemon-card-trainer.txt
          echo "Run ID: $GITHUB_RUN_ID" >> build-status/pokemon-card-trainer.txt
          sha256sum dist/TCG-Karten-Coach-2.4.2.apk >> build-status/pokemon-card-trainer.txt
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/tcg-karten-coach-v2.4.2" >> build-status/pokemon-card-trainer.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/pokemon-card-trainer.txt
          git commit -m "Record tested TCG Karten-Coach 2.4.2 build"
          git push origin HEAD:pokemon-card-trainer-android

      - name: Record failed build for diagnosis
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          echo "Version: 2.4.2" > build-status/pokemon-card-trainer.txt
          echo "Outcome: FAILED" >> build-status/pokemon-card-trainer.txt
          echo "Commit: $GITHUB_SHA" >> build-status/pokemon-card-trainer.txt
          echo "Run ID: $GITHUB_RUN_ID" >> build-status/pokemon-card-trainer.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/pokemon-card-trainer.txt
          git commit -m "Record failed TCG 2.4.2 build for diagnosis"
          git push origin HEAD:pokemon-card-trainer-android
