name: Build TCG Karten-Coach Android

on:
  push:
    branches:
      - pokemon-card-trainer-android
    paths:
      - 'pokemon-card-trainer/**'
      - '.github/workflows/pokemon-card-trainer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokemon-card-trainer-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: pokemon-card-trainer
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp pokemon-card-trainer/app/build/outputs/apk/debug/app-debug.apk dist/TCG-Karten-Coach-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/TCG-Karten-Coach-1.1.0.apk
          sha256sum dist/TCG-Karten-Coach-1.1.0.apk | tee dist/TCG-Karten-Coach-1.1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCG-Karten-Coach-1.1.0
          path: |
            dist/TCG-Karten-Coach-1.1.0.apk
            dist/TCG-Karten-Coach-1.1.0.sha256
          if-no-files-found: error
          retention-days: 14
