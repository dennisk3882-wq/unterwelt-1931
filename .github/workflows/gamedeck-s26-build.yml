name: Build GameDeck S26 APK

on:
  workflow_dispatch:
    inputs:
      eden_ref:
        description: 'Optional: full official Eden commit SHA for a candidate build'
        required: false
        type: string
  push:
    branches:
      - gamedeck-s26-v28-build
      - gamedeck-s26-v29-build
    tags:
      - gamedeck-s26-v*
    paths:
      - "gamedeck-s26/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: gamedeck-s26-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            rm -rf "$ANDROID_HOME/.temp"
          done

      - name: Validate GameDeck patch scripts
        run: python3 -m compileall -q gamedeck-s26/patch-v*.py

      - name: Reconstruct GameDeck sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gd
          cat gamedeck-s26/parts/overlay.b64.* | tr -d '\n\r' | base64 -d > /tmp/gamedeck-overlay.tgz
          tar -xzf /tmp/gamedeck-overlay.tgz -C gd
          python3 gamedeck-s26/patch-v2.py gd
          python3 gamedeck-s26/patch-v3.py gd
          python3 gamedeck-s26/patch-v4.py gd
          python3 gamedeck-s26/patch-v5.py gd
          python3 gamedeck-s26/patch-v6.py gd
          python3 gamedeck-s26/patch-v7.py gd
          python3 gamedeck-s26/patch-v8.py gd
          python3 gamedeck-s26/patch-v9.py gd
          python3 gamedeck-s26/patch-v10.py gd
          python3 gamedeck-s26/patch-v11.py gd
          python3 gamedeck-s26/patch-v12.py gd
          python3 gamedeck-s26/patch-v13.py gd
          python3 gamedeck-s26/patch-v14.py gd
          python3 gamedeck-s26/patch-v15.py gd
          python3 gamedeck-s26/patch-v16.py gd
          python3 gamedeck-s26/patch-v17.py gd
          python3 gamedeck-s26/patch-v18.py gd
          python3 gamedeck-s26/patch-v19.py gd
          python3 gamedeck-s26/patch-v20.py gd
          python3 gamedeck-s26/patch-v21.py gd
          python3 gamedeck-s26/patch-v22.py gd
          python3 gamedeck-s26/patch-v23.py gd
          python3 gamedeck-s26/patch-v24.py gd
          python3 gamedeck-s26/patch-v25.py gd
          python3 gamedeck-s26/patch-v26.py gd
          python3 gamedeck-s26/patch-v26b.py gd
          python3 gamedeck-s26/patch-v27.py gd
          python3 gamedeck-s26/patch-v28.py gd
          python3 gamedeck-s26/patch-v29.py gd
          python3 gamedeck-s26/patch-v30.py gd
          python3 gamedeck-s26/patch-v31.py gd
          python3 gamedeck-s26/patch-v32.py gd
          python3 gamedeck-s26/patch-v33.py gd
          python3 gamedeck-s26/patch-v34.py gd
          python3 gamedeck-s26/patch-v35.py gd
          python3 gamedeck-s26/patch-v36.py gd
          python3 gamedeck-s26/patch-v37.py gd
          python3 gamedeck-s26/patch-v38.py gd
          python3 gamedeck-s26/patch-v39.py gd
          grep -q 'GameDeck v39' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckRuntime.kt
          ! grep -Eqi 'KI aktiv spielen lassen|Autonomes Spielen|Koop-Coach|Koop-Modus|Co-op-Coach' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'adaptive_policy_used' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'adaptiveBestActionScore' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'autonomous_session_action_budget' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q '1200000L' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          grep -q 'scene_transition_count' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSceneObserver.kt
          grep -q 'scene_stable_age_ms' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSceneObserver.kt
          grep -q 'sceneTransitions' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAiLiveOverlay.kt
          grep -q 'capture_interval_ms' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSceneObserver.kt
          grep -q 'capture_age_ms' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSceneObserver.kt
          grep -q 'sceneGate' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'scene_gate' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAiLiveOverlay.kt
          grep -q 'chooseWithEpisodeMemory' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'episode_recoveries' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'recent_action_memory' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'NativeInput.ConsoleDevice' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'OVERLAY_PORT=NativeInput.Player1Device' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          ! grep -q 'OVERLAY_PORT=100' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAiLiveOverlay.kt
          grep -q 'live_step_count' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'GameDeckSceneObserver' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckVisualProbe.kt
          grep -q 'GameDeckSceneObserver' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSceneObserver.kt
          grep -q 'AI_SINGLE_WINDOW' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          grep -q 'NativeInput.onOverlayButtonEvent' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'NativeInput.onOverlayJoystickEvent' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'NativeInput.getInputDevices' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckHardwareAudit.kt
          grep -q 'startBenchmark' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          grep -q 'GameDeckProfileEngine.apply(activity,game,mode).getOrThrow()' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          grep -q 'GameDeckAutoPilot.configure' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckHardwareAudit.kt
          grep -q 'NativeInput.onGamePadButtonEvent' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoPilot.kt
          grep -q 'recoverInterruptedRun' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          grep -q 'visual_classification' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSmartAnalyzer.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckVisualProbe.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckSmartAnalyzer.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckAutoTester.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckTvPresentation.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckPerformanceAdvisor.kt
          test -s gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckUpdateChecker.kt
          grep -q 'consoleReadinessReport' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'fullSystemCheck' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckTechnicalActivity.kt
          grep -q 'exportLocalSettings' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'filter_favorites_only' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          test -f gd/tools/apply_to_eden.py
          test -f gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          test -f gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckMetadataRepository.kt
          grep -q 'Über das Spiel' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'WindowCompat.setDecorFitsSystemWindows' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'GameDeck-S26/1.2 (Android; image-loader)' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckMetadataRepository.kt
          grep -q 'onBackPressedDispatcher.addCallback' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'WindowInsetsCompat.Type.systemBars' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          grep -q 'showScreenshotViewer' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt
          test -f gd/overlay/src/main/res/drawable-nodpi/gamedeck_menu_bg.webp
          grep -q 'gamedeck_menu_bg' gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckActivity.kt

      - name: Clone current Eden source
        env:
          EDEN_SOURCE_REF: ${{ inputs.eden_ref || 'd16735f5b618942136d6ab53466e3be0a382c30a' }}
        shell: bash
        run: |
          set -euo pipefail
          EDEN_REF="$EDEN_SOURCE_REF"
          if [[ ! "$EDEN_REF" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          python3 - "$EDEN_REF" <<'PY'
          from pathlib import Path
          import sys
          p=Path('gd/overlay/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckRuntime.kt')
          p.write_text(p.read_text().replace('d16735f5b618942136d6ab53466e3be0a382c30a', sys.argv[1]))
          PY
          mkdir eden
          cd eden
          git init
          git remote add origin https://github.com/eden-emulator/mirror.git
          git fetch --depth 1 origin "$EDEN_REF"
          git checkout --detach FETCH_HEAD
          cd ..
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > eden/src/android/local.properties

          # Eden's CI SDL package currently does not always materialize the Java
          # bridge before Kotlin compilation. Seed the matching SDL 3.4.14 Java
          # sources explicitly so NativeLibrary can resolve org.libsdl.app.SDL.
          rm -rf /tmp/gamedeck-sdl
          git clone --depth 1 --branch release-3.4.14 https://github.com/libsdl-org/SDL.git /tmp/gamedeck-sdl
          mkdir -p eden/externals/generated/sdl/java
          cp -a /tmp/gamedeck-sdl/android-project/app/src/main/java/. eden/externals/generated/sdl/java/
          test -f eden/externals/generated/sdl/java/org/libsdl/app/SDL.java

      - name: Apply GameDeck integration
        shell: bash
        run: |
          set -euo pipefail
          python3 gd/tools/apply_to_eden.py eden
          python3 gamedeck-s26/patch-v22-eden.py eden
          python3 gamedeck-s26/patch-v23-eden.py eden
          python3 gamedeck-s26/patch-v28-eden.py eden
          python3 gamedeck-s26/patch-v29-eden.py eden
          python3 gamedeck-s26/patch-v30-eden.py eden
          python3 gamedeck-s26/patch-v39.py gd
          grep -q 'com.google.mlkit:text-recognition' eden/src/android/app/build.gradle.kts
          grep -q 'GameDeckAutoTester.onNativeStarted(this)' eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/activities/EmulationActivity.kt
          grep -q 'GameDeckAutoTester.onNativeStarted' eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/activities/EmulationActivity.kt
          grep -q 'GameDeckAutoTester.onNativeStopped' eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/activities/EmulationActivity.kt
          grep -q 'de.gamedeck.s26' eden/src/android/app/build.gradle.kts
          grep -q 'GameDeckActivity' eden/src/android/app/src/main/AndroidManifest.xml
          test -s eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckTvPresentation.kt
          test -s eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckPerformanceAdvisor.kt
          test -s eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/gamedeck/GameDeckUpdateChecker.kt

      - name: Download previously verified v14 APK for unchanged native Eden core
        uses: actions/download-artifact@v4
        with:
          name: GameDeck-S26-APK
          run-id: 38575320652
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: core-v14

      - name: Seed unchanged arm64 native Eden binaries
        shell: bash
        run: |
          set -euo pipefail
          APK=core-v14/GameDeck-S26.apk
          test -s "$APK"
          mkdir -p eden/src/android/app/src/main/jniLibs/arm64-v8a
          for lib in libyuzu-android.so libfile_redirect_hook.so libgsl_alloc_hook.so libhook_impl.so libmain_hook.so libVkLayer_khronos_validation.so; do
            unzip -p "$APK" "lib/arm64-v8a/$lib" > "eden/src/android/app/src/main/jniLibs/arm64-v8a/$lib"
            test -s "eden/src/android/app/src/main/jniLibs/arm64-v8a/$lib"
          done
          # Native binary content stays byte-for-byte identical to verified v14.
          sha256sum eden/src/android/app/src/main/jniLibs/arm64-v8a/libyuzu-android.so

      - name: Check Kotlin before native compilation
        working-directory: eden/src/android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew compileMainlineRelWithDebInfoKotlin --no-daemon --stacktrace -x 'configureCMakeRelWithDebInfo[arm64-v8a]' -x 'buildCMakeRelWithDebInfo[arm64-v8a]'
      
      - name: Build GameDeck APK and Eden core
        working-directory: eden/src/android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleMainlineRelWithDebInfo --no-daemon --stacktrace -x 'configureCMakeRelWithDebInfo[arm64-v8a]' -x 'buildCMakeRelWithDebInfo[arm64-v8a]'

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find eden/src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/GameDeck-S26.apk
          unzip -t artifacts/GameDeck-S26.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/GameDeck-S26.apk
          sha256sum artifacts/GameDeck-S26.apk | tee artifacts/GameDeck-S26.sha256
          ls -lh artifacts/GameDeck-S26.apk

      - name: Check native core parity with v14
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, hashlib
          with zipfile.ZipFile('core-v14/GameDeck-S26.apk') as base, zipfile.ZipFile('artifacts/GameDeck-S26.apk') as release:
              libs=[p for p in base.namelist() if p.startswith('lib/arm64-v8a/') and p.endswith('.so')]
              assert len(libs)==7, f'Expected 7 v14 libraries, found {len(libs)}'
              for path in libs:
                  assert path in release.namelist(), f'Missing v18 library: {path}'
                  assert hashlib.sha256(base.read(path)).digest()==hashlib.sha256(release.read(path)).digest(), f'Changed native core: {path}'
              print('Seven arm64 libraries retained byte-for-byte from v14')
          PY

      - name: Publish verified GameDeck APK on signed release tag
        if: startsWith(github.ref, 'refs/tags/gamedeck-s26-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          test -s artifacts/GameDeck-S26.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/GameDeck-S26.apk
          cp artifacts/GameDeck-S26.apk "artifacts/GameDeck-S26-${TAG#gamedeck-s26-}.apk"
          sha256sum "artifacts/GameDeck-S26-${TAG#gamedeck-s26-}.apk" > artifacts/SHA256SUMS.txt
          gh release create "$TAG"             "artifacts/GameDeck-S26-${TAG#gamedeck-s26-}.apk"             artifacts/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --title "GameDeck S26 ${TAG#gamedeck-s26-}"             --notes "Signiertes GameDeck-Update; manuelle Installation über Android. Gameplay- und HDMI-Tests müssen auf dem Zielgerät geprüft werden."             --verify-tag

      - name: Publish GameDeck v28 AI scene understanding preview
        if: github.ref == 'refs/heads/gamedeck-s26-v28-build'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/GameDeck-S26.apk
          test -s artifacts/GameDeck-S26.apk
          cp artifacts/GameDeck-S26.apk artifacts/GameDeck-S26-v28.apk
          sha256sum artifacts/GameDeck-S26-v28.apk > artifacts/GameDeck-S26-v28.sha256
          gh release create gamedeck-s26-v28 \
            artifacts/GameDeck-S26-v28.apk \
            artifacts/GameDeck-S26-v28.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "GameDeck S26 v28 · AI Scene Understanding Preview" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Lokale OCR von Spielszenen (Startmenü, Game Over, Laden, Fehler, möglicher Levelabschluss) und begrenzte kontextabhängige Controllersteuerung. Maximal 3 Minuten je KI-Einzeltest. Nicht in allen Spielen validiert; kein universelles trainiertes Gameplay-Modell. Vor aktivem Test Spielstände sichern."


      - name: Publish GameDeck v30 co-op coach preview (already published)
        if: false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/GameDeck-S26.apk
          test -s artifacts/GameDeck-S26.apk
          cp artifacts/GameDeck-S26.apk artifacts/GameDeck-S26-v30.apk
          sha256sum artifacts/GameDeck-S26-v30.apk > artifacts/GameDeck-S26-v30.sha256
          gh release create gamedeck-s26-v30 \
            artifacts/GameDeck-S26-v30.apk \
            artifacts/GameDeck-S26-v30.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "GameDeck S26 v30 · Co-op Coach Preview" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Neuer lokaler Co-op-Coach im Emulationsfenster: on-device OCR-Szenenerkennung und vorsichtige situative Hinweise. Der Coach sendet keine Eingaben und behauptet keine Levelabschlüsse. Ein echter zweiter KI-Spieler ist noch nicht enthalten; Zweitcontroller-Routing und spielbezogene Validierung sind weitere Entwicklungsschritte."


      - name: Publish GameDeck v31 objective-aware co-op coach preview (already published)
        if: false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/GameDeck-S26.apk
          test -s artifacts/GameDeck-S26.apk
          cp artifacts/GameDeck-S26.apk artifacts/GameDeck-S26-v31.apk
          sha256sum artifacts/GameDeck-S26-v31.apk > artifacts/GameDeck-S26-v31.sha256
          gh release create gamedeck-s26-v31 \
            artifacts/GameDeck-S26-v31.apk \
            artifacts/GameDeck-S26-v31.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "GameDeck S26 v31 · Objective-aware Co-op Coach" \
            --target "$GITHUB_SHA" \
            --prerelease \
